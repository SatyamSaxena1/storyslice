name: Storyslice
options:
  bundleIdPrefix: com.satyamsaxena

configs:
  Debug: debug
  Release: release

targets:
  Storyslice:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: Storyslice
        excludes:
          - Info.plist
    settings:
      base:
        # Use the committed Info.plist verbatim. NOT XcodeGen's `info:` key --
        # that *generates* a minimal plist from a template on every
        # `xcodegen generate` and silently overwrites the real file (it dropped
        # NSPhotoLibrary*UsageDescription, UILaunchStoryboardName, and the
        # portrait lock). GENERATE_INFOPLIST_FILE=NO stops xcodebuild doing the
        # same. $(...) vars still resolve; MinimumOSVersion / UIDeviceFamily are
        # still injected from the deployment settings below.
        INFOPLIST_FILE: Storyslice/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.satyamsaxena.storyslice
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        # Sideloaded onto a jailbroken device via TrollStore, not the App Store:
        # xcodebuild skips signing; CI ad-hoc-signs the .app afterward with this
        # entitlements file (see .github/workflows/build.yml). Referenced here so
        # a local Mac Xcode build stays consistent -- inert with signing off.
        CODE_SIGN_ENTITLEMENTS: Storyslice.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  StorysliceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - StorysliceTests
    dependencies:
      - target: Storyslice
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  Storyslice:
    build:
      targets:
        Storyslice: all
        StorysliceTests: [test]
    test:
      targets:
        - StorysliceTests
