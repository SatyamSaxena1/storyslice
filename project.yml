name: Storyslice
options:
  bundleIdPrefix: com.satyamsaxena

configs:
  Debug: debug
  Release: release

targets:
  Storyslice:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - Storyslice
    info:
      # File already exists with its own permission strings and launch
      # storyboard reference; XcodeGen uses it as-is.
      path: Storyslice/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satyamsaxena.storyslice
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        # Sideloaded onto a jailbroken device via TrollStore, not the App Store:
        # xcodebuild skips signing; CI ad-hoc-signs the .app afterward with this
        # entitlements file (see .github/workflows/build.yml). Referenced here so
        # a local Mac Xcode build stays consistent -- inert with signing off.
        CODE_SIGN_ENTITLEMENTS: Storyslice.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  StorysliceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - StorysliceTests
    dependencies:
      - target: Storyslice
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  Storyslice:
    build:
      targets:
        Storyslice: all
        StorysliceTests: [test]
    test:
      targets:
        - StorysliceTests
