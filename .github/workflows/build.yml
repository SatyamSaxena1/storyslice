name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available Xcode version
        run: xcodebuild -version

      # A plain -sdk build needs no device/simulator destination at all, which
      # sidesteps how much the simulator runtime lineup varies between
      # macos-latest runner instances. It still compiles the whole target,
      # Shaders.metal included, so it catches every real build error; running
      # the test targets (SegmentPlanTests/TransformTests locally, the
      # Metal-dependent PipelineIntegrationTests on the device matrix) is a
      # separate, manual step -- see README.
      - name: Build for simulator (compile check)
        run: |
          xcodebuild build \
            -project Storyslice.xcodeproj \
            -scheme Storyslice \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned .app for device
        run: |
          xcodebuild build \
            -project Storyslice.xcodeproj \
            -scheme Storyslice \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Ad-hoc sign for TrollStore
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/Storyslice.app

          # Deployment target is 13.0 (< 15.0), so xcodebuild must have copied
          # the Swift concurrency back-deployment runtime into the bundle.
          # Fail loudly if it did not -- the app would crash at launch on the
          # device otherwise.
          if [ ! -f "$APP/Frameworks/libswift_Concurrency.dylib" ]; then
            echo "::error::libswift_Concurrency.dylib missing from $APP/Frameworks"
            ls -la "$APP/Frameworks" || true
            exit 1
          fi

          # codesign requires nested code (embedded dylibs/frameworks) to be
          # signed before the containing bundle.
          for f in "$APP"/Frameworks/*.dylib "$APP"/Frameworks/*.framework; do
            [ -e "$f" ] || continue
            codesign --force --sign - --timestamp=none "$f"
          done

          codesign --force --sign - --timestamp=none \
            --entitlements Storyslice.entitlements \
            --generate-entitlement-der \
            "$APP"

          codesign --verify --verbose "$APP"
          codesign --display --entitlements :- "$APP" || true

      - name: Package IPA and TIPA
        run: |
          set -e
          cd build/Build/Products/Release-iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Storyslice.app Payload/
          zip -qry Storyslice.ipa Payload
          cp Storyslice.ipa Storyslice.tipa
          mv Storyslice.ipa Storyslice.tipa "$GITHUB_WORKSPACE/"

      - uses: actions/upload-artifact@v4
        with:
          name: Storyslice-trollstore
          path: |
            Storyslice.ipa
            Storyslice.tipa
          retention-days: 14
