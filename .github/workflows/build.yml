name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available Xcode version
        run: xcodebuild -version

      # A plain -sdk build needs no device/simulator destination at all, which
      # sidesteps how much the simulator runtime lineup varies between
      # macos-latest runner instances. It still compiles the whole target,
      # Shaders.metal included, so it catches every real build error; running
      # the test targets (SegmentPlanTests/TransformTests locally, the
      # Metal-dependent PipelineIntegrationTests on the device matrix) is a
      # separate, manual step -- see README.
      - name: Build for simulator (compile check)
        run: |
          xcodebuild build \
            -project Storyslice.xcodeproj \
            -scheme Storyslice \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned .app for device
        run: |
          xcodebuild build \
            -project Storyslice.xcodeproj \
            -scheme Storyslice \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          set -e
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r Storyslice.app Payload/
          zip -qr Storyslice.ipa Payload
          mv Storyslice.ipa "$GITHUB_WORKSPACE/Storyslice.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Storyslice-unsigned-ipa
          path: Storyslice.ipa
          retention-days: 14
