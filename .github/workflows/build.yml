name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available Xcode version
        run: xcodebuild -version

      # Metal-dependent pipeline tests need a real GPU and are covered on the
      # device matrix instead (see the plan). This simulator run still
      # compiles the whole target -- including Shaders.metal -- so it catches
      # any build error the pure-logic tests alone would miss.
      - name: Build and run pure-logic tests (simulator)
        run: |
          xcodebuild test \
            -project Storyslice.xcodeproj \
            -scheme Storyslice \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -only-testing:StorysliceTests/SegmentPlanTests \
            -only-testing:StorysliceTests/TransformTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned .app for device
        run: |
          xcodebuild build \
            -project Storyslice.xcodeproj \
            -scheme Storyslice \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          set -e
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r Storyslice.app Payload/
          zip -qr Storyslice.ipa Payload
          mv Storyslice.ipa "$GITHUB_WORKSPACE/Storyslice.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Storyslice-unsigned-ipa
          path: Storyslice.ipa
          retention-days: 14
